<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 Зарплатный калькулятор</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #f9fafb, #eef1f4);
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
      max-width: 380px;
      width: 90%;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
    }
    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #2a9d8f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #21867a;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f0fdf4;
      border: 1px solid #a7f3d0;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>💸 Зарплатный калькулятор</h2>
    <label>🧾 Тариф (₸):</label>
    <input type="number" step="0.01" id="tarif">

    <label>☀️ Дневные часы:</label>
    <input type="number" id="dayh">

    <label>🌙 Ночные часы:</label>
    <input type="number" id="nighth">

    <button onclick="calculateSalary()">📊 Рассчитать</button>

    <div class="result" id="result" style="display: none;"></div>
  </div>

  <script>
    const MRP = 3932;
    const MAX_OSMS = 17000;

    function calculateSalary() {
      const tarif = parseFloat(document.getElementById('tarif').value);
      const dayh = parseInt(document.getElementById('dayh').value);
      const nighth = parseInt(document.getElementById('nighth').value);

      if (isNaN(tarif) || isNaN(dayh) || isNaN(nighth)) {
        alert("Пожалуйста, заполните все поля корректно.");
        return;
      }

      const daySum = dayh * tarif;
      const nightSum = nighth * (tarif / 2);
      const kvart = (daySum + nightSum) * 0.3333;
      const vredn = 0;
      const oklad = daySum + nightSum + kvart + vredn;
      const opv = oklad * 0.1;
      const osms = Math.min(oklad * 0.02, MAX_OSMS);
      const ipn = Math.max((oklad - opv - (MRP * 14) - osms) * 0.1, 0);
      const naruki = oklad - opv - ipn - osms;

      const result = `
        <b>🧮 Начислено:</b><br>
        ├ ☀️ День: ${daySum.toFixed(2)} ₸<br>
        ├ 🌙 Ночь: ${nightSum.toFixed(2)} ₸<br>
        ├ 🎁 Премия 33.33%: ${kvart.toFixed(2)} ₸<br>
        └ 💼 Всего: ${oklad.toFixed(2)} ₸<br><br>
        <b>📉 Удержано:</b><br>
        ├ 🧾 ОПВ (10%): ${opv.toFixed(2)} ₸<br>
        ├ 🏥 ОСМС (2%): ${osms.toFixed(2)} ₸<br>
        └ 💸 ИПН (10%): ${ipn.toFixed(2)} ₸<br><br>
        <b>👐 На руки:</b> <b>${naruki.toFixed(2)} ₸</b>
      `;

      const resultBlock = document.getElementById('result');
      resultBlock.innerHTML = result;
      resultBlock.style.display = 'block';
    }
  </script>
</body>
</html>
