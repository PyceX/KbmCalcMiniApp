<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор Зарплаты</title>
  <style>
    :root {
      --blue: #2196F3;
      --red: #f44336;
      --green: #4CAF50;
      --gray: #888;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fff;
      color: #000;
    }

    .top-bar {
      background-color: var(--blue);
      color: white;
      padding: 8px 16px;
      text-align: center;
      font-size: 13px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    .center-icon {
      text-align: center;
      font-size: 24px;
      margin: 8px 0;
    }

    .row-inline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 15px;
      margin-bottom: 12px;
    }

    .row-inline .group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .row-inline input[type="number"] {
      width: 80px;
      padding: 6px;
      font-size: 16px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 16px;
    }

    input::placeholder {
      color: #aaa;
      font-size: 14px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--green);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    .grid-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .box {
      background-color: #f9f9f9;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
    }

    .box strong {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .box div {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    .final-total {
      text-align: center;
      font-size: 18px;
      margin: 12px 0;
      font-weight: bold;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .button-row button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .reset { background-color: var(--red); }
    .calc  { background-color: var(--green); }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--gray);
      margin-top: 16px;
    }

    .divider {
      width: 1px;
      height: 40px;
      background: #ccc;
    }
  </style>
</head>
<body>
  <div class="top-bar">1 МРП = 3932 ₸ | 1 МЗП = 85000 ₸</div>
  <div class="container">
    <div class="center-icon">🌤</div>

    <input type="number" id="tarif" placeholder="Часовой тариф" />

    <div class="row-inline">
      <div class="group">
        <label for="dayh">День (час):</label>
        <input type="number" id="dayh" placeholder="0">
      </div>
      <div class="divider"></div>
      <div class="group">
        <label for="nighth">Ночь (час):</label>
        <input type="number" id="nighth" placeholder="0">
      </div>
    </div>

    <div class="toggle">
      <span>Профсоюз 1%</span>
      <label class="switch">
        <input type="checkbox" id="union">
        <span class="slider"></span>
      </label>
    </div>

    <div class="grid-two">
      <div class="box">
        <strong>Начислено:</strong>
        <div><span>День:</span><span id="res_day">0.00 ₸</span></div>
        <div><span>Ночь:</span><span id="res_night">0.00 ₸</span></div>
        <div><span>33.3%:</span><span id="res_bonus">0.00 ₸</span></div>
        <div><strong>Всего:</strong><strong id="res_total">0.00 ₸</strong></div>
      </div>
      <div class="box">
        <strong>Удержано:</strong>
        <div><span>ИПН:</span><span id="res_ipn">0.00 ₸</span></div>
        <div><span>ОПВ:</span><span id="res_opv">0.00 ₸</span></div>
        <div><span>ОСМС:</span><span id="res_osms">0.00 ₸</span></div>
        <div id="union_line" style="display: none;"><span>Профсоюз:</span><span id="res_union">0.00 ₸</span></div>
        <div><strong>Всего:</strong><strong id="res_withheld">0.00 ₸</strong></div>
      </div>
    </div>

    <div class="final-total">На руки: <span id="res_naruki">0.00 ₸</span></div>

    <div class="button-row">
      <button class="reset" onclick="resetForm()">СБРОСИТЬ</button>
      <button class="calc" onclick="calculate()">РАССЧИТАТЬ</button>
    </div>

    <div class="footer">
      Версия: 1.0<br>
      t.me/id362<br>
      @kbm_calc_bot
    </div>
  </div>

  <script>
    const MRP = 3932;
    const MAX_OSMS = 17000;

    function format(n) {
      return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₸';
    }

    function calculate() {
      const tarif = parseFloat(document.getElementById('tarif').value) || 0;
      const dayh = parseInt(document.getElementById('dayh').value) || 0;
      const nighth = parseInt(document.getElementById('nighth').value) || 0;
      const union = document.getElementById('union').checked;

      localStorage.setItem('tarif', tarif);

      const daySum = dayh * tarif;
      const nightSum = nighth * (tarif / 2);
      const bonus = (daySum + nightSum) * 0.3333;
      const rawTotal = daySum + nightSum + bonus;
      const profsouz = union ? rawTotal * 0.01 : 0;
      const total = rawTotal - profsouz;

      const opv = total * 0.1;
      let osms = total * 0.02;
      if (osms > MAX_OSMS) osms = MAX_OSMS;
      const ipnBase = total - opv - (MRP * 14) - osms;
      const ipn = ipnBase > 0 ? ipnBase * 0.1 : 0;
      const withheld = ipn + opv + osms + profsouz;
      const naruki = rawTotal - withheld;

      document.getElementById('res_day').textContent = format(daySum);
      document.getElementById('res_night').textContent = format(nightSum);
      document.getElementById('res_bonus').textContent = format(bonus);
      document.getElementById('res_total').textContent = format(rawTotal);

      document.getElementById('res_ipn').textContent = format(ipn);
      document.getElementById('res_opv').textContent = format(opv);
      document.getElementById('res_osms').textContent = format(osms);
      document.getElementById('res_union').textContent = format(profsouz);
      document.getElementById('res_withheld').textContent = format(withheld);
      document.getElementById('res_naruki').textContent = format(naruki);

      document.getElementById('union_line').style.display = union ? 'flex' : 'none';
    }

    function resetValues(keepTarif = false, keepHours = false) {
      if (!keepTarif) document.getElementById('tarif').value = '';
      if (!keepHours) {
        document.getElementById('dayh').value = '';
        document.getElementById('nighth').value = '';
      }
      document.querySelectorAll('span[id^="res_"]').forEach(span => span.textContent = '0.00 ₸');
      document.getElementById('union_line').style.display = document.getElementById('union').checked ? 'flex' : 'none';
    }

    function resetForm() {
      document.getElementById('union').checked = false;
      resetValues(true, false);
    }

    document.getElementById('union').addEventListener('change', function () {
      const union = this.checked;
      document.getElementById('union_line').style.display = union ? 'flex' : 'none';
      resetValues(true, true);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const tarif = localStorage.getItem('tarif');
      if (tarif !== null) document.getElementById('tarif').value = tarif;
    });
  </script>
</body>
</html>
